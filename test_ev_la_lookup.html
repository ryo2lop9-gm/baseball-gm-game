<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>EV/LA Lookup Test</title>
</head>
<body>
  <h1>EV/LA Lookup Test</h1>
  <pre id="output">読み込み中...</pre>

  <script type="module">
    import { loadEvLaLookup } from "./services/evLaLookupStore.js";
    import { getEvLaOutcomeProbabilities } from "./services/evLaOutcomeService.js";

    const output = document.getElementById("output");

    try {
      const lookup = await loadEvLaLookup();

      const result = getEvLaOutcomeProbabilities({
        exitVelocity: 101,
        launchAngle: 24,
        lookup,
      });

      output.textContent = JSON.stringify(result, null, 2);
      console.log(result);
    } catch (error) {
      output.textContent = error.stack || String(error);
      console.error(error);
    }
  </script>
</body>
</html>
